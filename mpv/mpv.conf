# Video
vo=gpu-next
gpu-api=vulkan

# HDR passthrough — let the display handle HDR metadata instead of tone-mapping
target-colorspace-hint=yes

# Cache — 3x defaults (450MiB forward, 150MiB back, 30s read-ahead)
cache=yes
demuxer-max-bytes=471859200
demuxer-max-back-bytes=157286400
demuxer-readahead-secs=30

# YouTube: let yt-dlp use Brave's cookies so it passes the
# "Sign in to confirm you're not a bot" check (and its HTTP 429s).
# Stays local: syncplay-rs never shares these options with the room.
# macOS: Brave's cookie key is in the Keychain (allow the prompt once).
[ytdl-cookies-macos]
profile-cond=platform == "darwin"
ytdl-raw-options-append=cookies-from-browser=brave

# NixOS (KDE Plasma 6): Brave keeps its cookie key in KWallet.
[ytdl-cookies-linux]
profile-cond=platform == "linux"
ytdl-raw-options-append=cookies-from-browser=brave+kwallet6
